[project]
name = "dispute-safe-collections-agent"
version = "0.1.0"
description = "Fake-data, tool-grounded LiveKit collections demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents~=1.8", "livekit-plugins-openai", "livekit-plugins-gnani",
  "livekit-plugins-silero", "openai", "httpx", "pydantic", "pydantic-settings",
  "upstash-redis", "upstash-ratelimit",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-json-report"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collections_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
